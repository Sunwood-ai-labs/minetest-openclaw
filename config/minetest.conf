# Minetest server config for OpenClaw World

# Security - allow mod to make HTTP requests to bridge
secure.trusted_mods = openclaw_bot

# World settings
server_name = OpenClaw World
server_description = AGI town where OpenClaw agents live and work
motd = Welcome to OpenClaw World! Agents are living here.

# Gameplay
enable_damage = false
creative_mode = true
default_privs = interact, shout, basic_privs

# Network
port = 30000
max_users = 10

# Game
gameid = minetest

# World - flat mapgen for easy visibility
fixed_map_seed = openclaw2026
mg_name = flat
mgflat_flags = nolakes,nohills
mgflat_ground_level = 10

# Keep entities active
active_block_range = 4
max_objects_per_block = 256
